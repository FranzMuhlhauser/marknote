appId: com.marknote.app
productName: Marknote
directories:
  buildResources: resources
  output: dist-electron
files:
  - out/**/*
  - resources/icon.png
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
linux:
  icon: resources/icon.png
  # Hace que el .desktop se llame como desktopName (package.json) y que
  # StartupWMClass coincida con el app_id que usa Electron, para que el
  # lanzador asocie la ventana abierta con la entrada del menú.
  syncDesktopName: true
  maintainer: FranzMuhlhauser <franz.muhlhauser@gmail.com>
  category: Office
  synopsis: Editor Markdown WYSIWYG nativo
  target:
    - target: deb
      arch:
        - x64
    - target: appimage
      arch:
        - x64
fileAssociations:
  - ext: .md
    description: Markdown
    icon: resources/icon.ico
publish:
  provider: github
  owner: FranzMuhlhauser
  repo: marknote
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Marknote
